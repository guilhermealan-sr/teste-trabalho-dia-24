<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <title>Perfil - Coleção Front-End</title>
</head>
<body>

    <div class="header">
        <h1 class="logo">Coleção Front-End</h1>

        <div class="menu d-flex align-items-center">
            <a href="index.html" class="ms-3">Início</a>
            <a href="filmes.html" class="ms-3">Filmes</a>
            <a href="perfil.html" class="text-warning ms-3">Perfil</a>
        </div>
    </div>

    <div class="container mt-5" style="max-width: 1000px; padding-top: 40px;">

        <div id="tela-conta">

            <div class="caixa" id="caixa-cadastro">
                <h2 class="texto-branco mb-3">Criar uma conta</h2>
                <form id="form-cadastro">
                    <div class="mb-3">
                        <label for="cad-email">Email</label>
                        <input type="email" id="cad-email" class="form-control" placeholder="exemplo@email.com" required>
                    </div>
                    <div class="mb-3">
                        <label for="cad-nick">Nickname</label>
                        <input type="text" id="cad-nick" class="form-control" maxlength="15" required>
                    </div>
                    <div class="mb-3">
                        <label for="cad-senha">Senha</label>
                        <input type="password" id="cad-senha" class="form-control" required>
                    </div>
                    <div class="mb-3">
                        <label for="cad-confirmar">Confirmar senha</label>
                        <input type="password" id="cad-confirmar" class="form-control" required>
                    </div>
                    <p class="text-danger" id="erro-cadastro"></p>
                    <button type="submit" class="btn-rosa w-100">Criar conta</button>
                </form>
                <p class="mt-3 mb-0 texto-cinza">Já tem uma conta? <a href="#" id="ir-login" class="text-warning">Entrar</a></p>
            </div>

            <div class="caixa" id="caixa-login" hidden>
                <h2 class="texto-branco mb-3">Entrar</h2>
                <form id="form-login">
                    <div class="mb-3">
                        <label for="login-email">Email</label>
                        <input type="email" id="login-email" class="form-control" required>
                    </div>
                    <div class="mb-3">
                        <label for="login-senha">Senha</label>
                        <input type="password" id="login-senha" class="form-control" required>
                    </div>
                    <p class="text-danger" id="erro-login"></p>
                    <button type="submit" class="btn-verde w-100">Entrar</button>
                </form>
                <p class="mt-3 mb-0 texto-cinza">Não tem conta? <a href="#" id="ir-cadastro" class="text-warning">Criar uma conta</a></p>
            </div>

        </div>

        <div id="tela-perfil" hidden>

            <div class="d-flex align-items-center mb-4">
                <div id="area-foto"></div>
                <div class="ms-4">
                    <h2 class="texto-branco" id="perfil-nick"></h2>
                    <p class="bio" id="perfil-bio" hidden></p>
                    <button type="button" class="btn-cinza btn-grande" id="btn-editar">EDITAR PERFIL</button>
                    <button type="button" class="btn-cinza btn-grande ms-2" id="btn-sair">SAIR</button>
                </div>
            </div>

            <form class="caixa caixa-editar mb-4" id="area-editar" hidden>
                <h5 class="texto-branco mb-3">Editar perfil</h5>
                <div class="mb-3">
                    <label for="edit-nick">Nickname</label>
                    <input type="text" id="edit-nick" class="form-control" maxlength="15" required>
                </div>
                <div class="mb-3">
                    <label>Foto</label>
                    <div class="d-flex align-items-center gap-3">
                        <div id="previa-foto"></div>
                        <div>
                            <button type="button" class="btn-cinza" id="btn-trocar-foto">TROCAR FOTO</button>
                            <button type="button" class="btn-cinza ms-1" id="btn-remover-foto">REMOVER</button>
                        </div>
                    </div>
                    <input type="file" id="campo-foto" accept="image/*" hidden>
                    <p class="text-danger mb-0 mt-1" id="erro-foto"></p>
                </div>
                <div class="mb-3">
                    <label for="edit-bio">Biografia</label>
                    <textarea id="edit-bio" class="form-control" rows="4" maxlength="200"></textarea>
                </div>
                <p class="text-danger" id="erro-editar"></p>
                <button type="submit" class="btn-verde">Salvar</button>
                <button type="button" class="btn-cinza ms-1" id="btn-cancelar">CANCELAR</button>
            </form>

            <h3 class="titulo-secao">Filmes favoritos</h3>
            <div class="grade-favoritos" id="grade-favoritos"></div>

            <div class="titulo-secao mt-5 d-flex justify-content-between align-items-center">
                <span>Minha lista (<span id="contador-lista">0</span>)</span>
                <button type="button" class="btn-cinza" data-bs-toggle="modal" data-bs-target="#modal-lista">+ ADICIONAR FILME</button>
            </div>
            <p class="texto-cinza" id="lista-vazia">Sua lista está vazia. Adicione os filmes que você quer ver ou guardar.</p>
            <div class="grade-lista" id="grade-lista"></div>

        </div>

    </div>

    <div class="modal fade" id="modal-busca" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Adicionar filme favorito</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <input type="text" id="campo-busca" class="form-control" placeholder="Digite o nome do filme...">
                    <div class="lista-resultados" id="lista-resultados"></div>
                </div>
            </div>
        </div>
    </div>

    <div class="modal fade" id="modal-lista" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Adicionar à minha lista</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <input type="text" id="campo-busca-lista" class="form-control" placeholder="Digite o nome do filme...">
                    <div class="lista-resultados" id="lista-resultados-lista"></div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="bancoFilmes.js"></script>
    <script src="usuario.js"></script>
    <script src="perfil.js"></script>
</body>
</html>
