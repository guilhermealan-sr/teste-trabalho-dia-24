<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <title>Início - Coleção Front-End</title>
</head>
<body>

    <div class="header">
        <h1 class="logo">Coleção Front-End</h1>
        
        <div class="menu d-flex align-items-center">
            <a href="index.html" class="text-warning ms-3">Início</a>
            <a href="filmes.html" class="ms-3">Filmes</a>
            <a href="perfil.html" class="ms-3">Perfil</a>
        </div>
    </div>

    <div class="container mt-5" style="max-width: 1000px; padding-top: 40px;">
        
        <div class="banner d-flex justify-content-between align-items-center">
            <div>
                <h2 class="texto-branco">Bem-vindo, <span style="color: #00c030;" id="nomeUsuario">Visitante</span>!</h2>
                <p class="m-0">Pronto para atualizar seu catálogo hoje?</p>
            </div>
            <a href="filmes.html" class="btn-verde" id="botaoBanner">+ Adicionar um filme</a>
        </div>

        <div class="row text-center mt-5 mb-5">
            <div class="col">
                <h2 class="texto-branco m-0">0</h2>
                <p style="font-size: 12px; text-transform: uppercase; margin-top: 5px;">Assistidos</p>
            </div>
            <div class="col">
                <h2 class="texto-branco m-0" id="numLista">0</h2>
                <p style="font-size: 12px; text-transform: uppercase; margin-top: 5px;">Na Lista</p>
            </div>
            <div class="col">
                <h2 class="texto-branco m-0" id="numFavoritos">0</h2>
                <p style="font-size: 12px; text-transform: uppercase; margin-top: 5px;">Favoritos</p>
            </div>
            <div class="col">
                <h2 class="texto-branco m-0" id="numCatalogo">0</h2>
                <p style="font-size: 12px; text-transform: uppercase; margin-top: 5px;">No Catálogo</p>
            </div>
        </div>

        <div class="d-flex justify-content-between align-items-center mb-2">
            <h3 class="texto-branco m-0">Atividade Recente</h3>
        </div>
        <div id="listaAtividade" class="mb-5">
            <p class="texto-cinza m-0">Sem atividades recentes no momento</p>
        </div>

        <div class="d-flex justify-content-between align-items-center mb-2">
            <h3 class="texto-branco m-0">Catálogo Completo</h3>
            <a href="filmes.html" class="texto-cinza" style="font-size: 14px;">Exibir mais</a>
        </div>
        <div class="grade-posters" id="gradePosters"></div>

    </div>

    <script src="bancoFilmes.js"></script>
    <script src="usuario.js"></script>
</body>
</html>
